{% extends 'base.html' %}

{% block title %}Eliminar Persona{% endblock %}

{% block content %}
<h2>Confirmar Eliminación</h2>

<div class="alert alert-warning mt-4">
    <h5>¿Está seguro que desea eliminar esta persona?</h5>
    <p class="mb-0"><strong>{{ persona.get_nombre_completo }}</strong> ({{ persona.rut }})</p>
</div>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sí, Eliminar</button>
    <a href="{% url 'persona_list' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
